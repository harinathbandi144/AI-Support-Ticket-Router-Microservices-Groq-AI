
server:
  port: 8080

spring:
  application:
    name: ai-ticket-router
  profiles:
    active: h2

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:ticketdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_db
    driver-class-name: org.postgresql.Driver
    username: ticket
    password: ticket

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
